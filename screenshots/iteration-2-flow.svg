<svg xmlns="http://www.w3.org/2000/svg" width="900" height="482" viewBox="0 0 900 482" role="img" aria-labelledby="title desc">
<title id="title">Iteration 2 planning flow</title>
<desc id="desc">Enter a weekend request. Use an explicit destination or answer the clarification. The trip opens with an editable itinerary and map. Use chat, edit an option, or review the estimate.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#61758d"/></marker></defs>
<rect x="1" y="1" width="898" height="480" rx="20" fill="#f8fafc" stroke="#dde5ef"/>
<g fill="none" stroke="#61758d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
<path d="M450 74 V97 M231 97 H669"/><path d="M231 97 V116" marker-end="url(#arrow)"/><path d="M669 97 V116" marker-end="url(#arrow)"/><path d="M231 180 V208 H669 V180"/><path d="M450 208 V232" marker-end="url(#arrow)"/><path d="M450 296 V322 M156 322 H744"/><path d="M156 322 V346" marker-end="url(#arrow)"/><path d="M450 322 V346" marker-end="url(#arrow)"/><path d="M744 322 V346" marker-end="url(#arrow)"/>
</g>
<g font-family="Arial, sans-serif" text-anchor="middle">
<rect x="303.0" y="24" width="294" height="50" rx="12" fill="#ecf4ff" stroke="#87add8"/><text x="450" y="55" font-size="19" font-weight="650" fill="#154377">Enter a weekend request</text><rect x="62.0" y="116" width="338" height="64" rx="12" fill="#ffffff" stroke="#8fa5bf"/><text x="231" y="143" font-size="19" font-weight="650" fill="#142940">Destination is specified</text><text x="231" y="165" font-size="15" fill="#44536a">Use the city in the request</text><rect x="500.0" y="116" width="338" height="64" rx="12" fill="#ffffff" stroke="#8fa5bf"/><text x="669" y="143" font-size="19" font-weight="650" fill="#142940">Destination needs confirmation</text><text x="669" y="165" font-size="15" fill="#44536a">Keep Bengaluru or compare options</text><rect x="268.0" y="232" width="364" height="64" rx="12" fill="#ecf4ff" stroke="#87add8"/><text x="450" y="259" font-size="19" font-weight="650" fill="#154377">Open the itinerary and map</text><text x="450" y="281" font-size="15" fill="#44536a">See the route and estimated total</text><rect x="25.0" y="346" width="262" height="64" rx="12" fill="#ffffff" stroke="#8fa5bf"/><text x="156" y="373" font-size="19" font-weight="650" fill="#142940">Ask for a change</text><text x="156" y="395" font-size="15" fill="#44536a">Preview and apply the edit</text><rect x="319.0" y="346" width="262" height="64" rx="12" fill="#ffffff" stroke="#8fa5bf"/><text x="450" y="373" font-size="19" font-weight="650" fill="#142940">Edit an option</text><text x="450" y="395" font-size="15" fill="#44536a">Compare and swap directly</text><rect x="613.0" y="346" width="262" height="64" rx="12" fill="#ffffff" stroke="#8fa5bf"/><text x="744" y="373" font-size="19" font-weight="650" fill="#142940">Review the trip</text><text x="744" y="395" font-size="15" fill="#44536a">Check the total and approve</text><text x="450" y="451" font-size="16" fill="#44536a">Applied changes update the same itinerary, route, and estimate.</text>
</g>
</svg>