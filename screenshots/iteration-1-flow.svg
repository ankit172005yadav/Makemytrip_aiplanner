<rect x="303.0" y="24" width="294" height="50" rx="12" fill="#fff0f1" stroke="#d499a4"/><text x="450" y="55" font-size="19" font-weight="650" fill="#692538">India inspiration</text><rect x="62.0" y="116" width="338" height="64" rx="12" fill="#ffffff" stroke="#8fa5bf"/><text x="231" y="143" font-size="19" font-weight="650" fill="#142940">Browse the guides</text><text x="231" y="165" font-size="15" fill="#44536a">Pick Jaipur, Ahmedabad, or Hampi</text><rect x="500.0" y="116" width="338" height="64" rx="12" fill="#ffffff" stroke="#8fa5bf"/><text x="669" y="143" font-size="19" font-weight="650" fill="#142940">Ask the assistant</text><text x="669" y="165" font-size="15" fill="#44536a">Choose a city and trip preferences</text><rect x="279.0" y="230" width="342" height="64" rx="12" fill="#fff0f1" stroke="#d499a4"/><text x="450" y="257" font-size="19" font-weight="650" fill="#692538">Open the itinerary and map</text><text x="450" y="279" font-size="15" fill="#44536a">See each day and its stops</text><rect x="62.0" y="340" width="338" height="64" rx="12" fill="#ffffff" stroke="#8fa5bf"/><text x="231" y="367" font-size="19" font-weight="650" fill="#142940">Explore the day</text><text x="231" y="389" font-size="15" fill="#44536a">Filter the route or focus a stop</text><rect x="500.0" y="340" width="338" height="64" rx="12" fill="#ffffff" stroke="#8fa5bf"/><text x="669" y="367" font-size="19" font-weight="650" fill="#142940">Edit an option</text><text x="669" y="389" font-size="15" fill="#44536a">Compare a different stop or stay</text>
