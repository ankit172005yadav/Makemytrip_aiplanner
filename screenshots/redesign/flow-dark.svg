<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="196" viewBox="0 0 1280 196" role="img" aria-label="Five steps: ask, confirm, read, change, approve.">
  <rect width="1280" height="196" rx="24" fill="#1c1c1e"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif">
    <line x1="156" y1="56" x2="1124" y2="56" stroke="#48484a" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
    <circle cx="128" cy="56" r="20" fill="#3b8cf0"/><text x="128" y="62" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text>
    <text x="128" y="112" text-anchor="middle" font-size="19" font-weight="650" fill="#f5f5f7" letter-spacing="-0.3">Ask</text>
    <text x="128" y="140" text-anchor="middle" font-size="15" fill="#a1a1a6">A budget, a place</text>
    <text x="128" y="161" text-anchor="middle" font-size="15" fill="#a1a1a6">or a mood.</text><circle cx="384" cy="56" r="20" fill="#3b8cf0"/><text x="384" y="62" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text>
    <text x="384" y="112" text-anchor="middle" font-size="19" font-weight="650" fill="#f5f5f7" letter-spacing="-0.3">Confirm</text>
    <text x="384" y="140" text-anchor="middle" font-size="15" fill="#a1a1a6">One question, only if</text>
    <text x="384" y="161" text-anchor="middle" font-size="15" fill="#a1a1a6">it changes the plan.</text><circle cx="640" cy="56" r="20" fill="#3b8cf0"/><text x="640" y="62" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text>
    <text x="640" y="112" text-anchor="middle" font-size="19" font-weight="650" fill="#f5f5f7" letter-spacing="-0.3">Read</text>
    <text x="640" y="140" text-anchor="middle" font-size="15" fill="#a1a1a6">Flights, stay and each</text>
    <text x="640" y="161" text-anchor="middle" font-size="15" fill="#a1a1a6">day, with the budget.</text><circle cx="896" cy="56" r="20" fill="#1c1c1e" stroke="#ff453a" stroke-width="2" stroke-dasharray="4 3"/><text x="896" y="62" text-anchor="middle" font-size="16" font-weight="700" fill="#ff453a">4</text>
    <text x="896" y="112" text-anchor="middle" font-size="19" font-weight="650" fill="#f5f5f7" letter-spacing="-0.3">Change</text>
    <text x="896" y="140" text-anchor="middle" font-size="15" fill="#a1a1a6">Edits arrive as proposals</text>
    <text x="896" y="161" text-anchor="middle" font-size="15" fill="#a1a1a6">you apply or keep.</text><circle cx="1152" cy="56" r="20" fill="#3b8cf0"/><text x="1152" y="62" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">5</text>
    <text x="1152" y="112" text-anchor="middle" font-size="19" font-weight="650" fill="#f5f5f7" letter-spacing="-0.3">Approve</text>
    <text x="1152" y="140" text-anchor="middle" font-size="15" fill="#a1a1a6">Review the whole trip,</text>
    <text x="1152" y="161" text-anchor="middle" font-size="15" fill="#a1a1a6">then approve it.</text>
  </g>
</svg>
